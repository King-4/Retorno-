<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retorno da TV</title>
<style>
:root{--bg:#f6f6f4;--fg:#1a1a1a;--card:#fff;--bd:#d8d8d4;--ac:#2563eb;--red:#c62828;--mut:#666}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--card:#1e1e1e;--bd:#333;--ac:#4f8cff;--mut:#999}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:1.3rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button.r{background:var(--red)}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);margin-top:6px}
#code{text-align:center;letter-spacing:.3em;text-transform:uppercase;font-size:1.4rem}
label{font-size:.85rem;color:var(--mut);display:block;margin-top:8px}
video{width:100%;background:#000;border-radius:10px;margin-top:10px}
.big{font-size:2.2rem;font-weight:700;letter-spacing:.25em;text-align:center;margin:8px 0}
#qr{text-align:center;background:#fff;border-radius:10px;padding:10px}
#qr svg{width:220px;height:220px}
.st{font-size:.9rem;color:var(--mut);margin-top:8px}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<h1>📺 Retorno da TV</h1>

<div id="home" class="card">
  <button onclick="tela('criar')">Criar transmissão</button>
  <button class="s" onclick="tela('acessar')">Acessar transmissão</button>
</div>

<div id="criar" class="card hide">
  <label for="nome">Nome da transmissão</label>
  <input id="nome" value="Retorno da TV" maxlength="40">
  <label for="qual">Qualidade</label>
  <select id="qual">
    <option value="nitido">Nítida (melhor pra textos e slides)</option>
    <option value="fluido">Fluida (melhor pra vídeo em movimento)</option>
  </select>
  <button id="bShare" onclick="compartilhar()">Compartilhar tela</button>
  <button id="bStop" class="r hide" onclick="encerrar()">⏹ Encerrar transmissão</button>
  <div id="painel" class="hide" style="margin-top:12px">
    <div id="qr" class="hide"></div>
    <div id="big" class="big"></div>
    <div style="text-align:center;color:var(--mut);font-size:.9rem">QR code e código valem até você encerrar a transmissão</div>
  </div>
  <div id="st1" class="st"></div>
  <button class="s" onclick="voltar()">Voltar</button>
</div>

<div id="acessar" class="card hide">
  <div id="entrada">
    <label for="code">Código de acesso (5 caracteres)</label>
    <input id="code" maxlength="5" autocomplete="off">
    <button onclick="entrar()">Entrar na transmissão</button>
  </div>
  <div id="sessao" class="hide">
    <div id="vnome" style="font-weight:600"></div>
    <button id="bVer" onclick="assistir()">Ver compartilhamento</button>
    <button id="bPara" class="r hide" onclick="pararVer()">⏹ Parar de ver</button>
    <video id="vid" autoplay playsinline muted controls class="hide"></video>
    <button id="bFull" class="s hide" onclick="document.getElementById('vid').requestFullscreen()">Tela cheia</button>
    <button class="s" onclick="sair()">Sair da transmissão</button>
  </div>
  <div id="st2" class="st"></div>
  <button id="bVoltar" class="s" onclick="voltar()">Voltar</button>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PRE="retornotv-";
const ALFA="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const rand5=()=>Array.from({length:5},()=>ALFA[Math.floor(Math.random()*ALFA.length)]).join("");
const msg=(id,t)=>$(id).textContent=t;
const MAXBR=8000; /* kbps */
function tela(n){["home","criar","acessar"].forEach(x=>$(x).classList.toggle("hide",x!==n))}
function voltar(){encerrar();sair();tela("home")}
/* sobe o limite de banda no SDP (b=AS) pra imagem não ficar borrada */
function sdpBanda(sdp){return sdp.replace(/(m=video[^\r\n]*\r\n(?:c=[^\r\n]*\r\n)?)(?!b=)/,"$1b=AS:"+MAXBR+"\r\n")}

/* ---------- Criar transmissão ---------- */
let main=null, stream=null, hb=null;
const sessions=new Map(); /* idDoViewer -> {ch, call} */

function status(){
  msg("st1",sessions.size?("Pessoas conectadas: "+sessions.size):"Transmitindo. Mostre o QR code ou passe o código pra quem vai assistir.");
}

async function compartilhar(){
  try{
    const nitido=$("qual").value==="nitido";
    const md=navigator.mediaDevices;
    if(md&&md.getDisplayMedia){
      stream=await md.getDisplayMedia({video:{frameRate:{ideal:nitido?20:30},width:{ideal:1920},height:{ideal:1080}},audio:false});
    }else if(md&&md.getUserMedia){
      stream=await md.getUserMedia({video:true});
      msg("st1","Este aparelho não compartilha tela; usando a câmera.");
    }else throw new Error("navegador sem suporte");
    const vt=stream.getVideoTracks()[0];
    try{vt.contentHint=nitido?"detail":"motion"}catch(e){}
    vt.onended=encerrar;
    criarSala(0);
  }catch(e){msg("st1","Erro: "+e.message)}
}

/* a sala é um peer com id fixo (PRE+código): vale até encerrar */
function criarSala(tentativa){
  const code=rand5();
  const p=new Peer(PRE+code);
  main=p;
  p.on("open",()=>{
    $("bShare").classList.add("hide");$("bStop").classList.remove("hide");
    $("painel").classList.remove("hide");
    $("big").textContent=code;
    const q=$("qr");
    if(window.qrcode){
      const url=location.origin+location.pathname+"#c="+code;
      const o=qrcode(0,"M");o.addData(url);o.make();
      q.innerHTML=o.createSvgTag({scale:6,margin:2});
      q.classList.remove("hide");
    }
    status();
    clearInterval(hb);
    /* batimento: manda ping e remove quem ficou 8s sem responder (aba fechada à força) */
    hb=setInterval(()=>{
      const now=Date.now();
      sessions.forEach((s,id)=>{
        if(now-s.seen>(s.away?180000:8000))dropSession(id);
        else if(s.ch.open){try{s.ch.send({cmd:"ping"})}catch(e){}}
      });
    },2000);
  });
  p.on("error",e=>{
    if(e.type==="unavailable-id"&&tentativa<5){p.destroy();criarSala(tentativa+1)}
    else msg("st1","Erro de conexão: "+e.type);
  });
  p.on("disconnected",()=>{if(main===p&&!p.destroyed){try{p.reconnect()}catch(e){}}});
  p.on("connection",c=>{
    c.on("open",()=>{
      const id=c.peer;
      sessions.set(id,{ch:c,call:null,seen:Date.now()});
      c.send({nome:$("nome").value||"Retorno da TV"});
      status();
    });
    c.on("data",m=>{
      if(!m)return;
      const s=sessions.get(c.peer);
      if(s){s.seen=Date.now();s.away=(m.cmd==="away")}
      if(m.cmd==="watch")iniciar(c.peer);
      if(m.cmd==="stop")fecharCall(c.peer);
      if(m.cmd==="bye")dropSession(c.peer);
    });
    c.on("close",()=>dropSession(c.peer));
  });
}

function iniciar(id){
  const s=sessions.get(id);
  if(!s||!stream||!main)return;
  fecharCall(id);
  const call=main.call(id,stream,{sdpTransform:sdpBanda});
  s.call=call;
  call.on("close",()=>{if(s.call===call)s.call=null});
  const pc=call.peerConnection;
  pc.addEventListener("connectionstatechange",()=>{
    if(pc.connectionState!=="connected")return;
    const nitido=$("qual").value==="nitido";
    try{
      pc.getSenders().forEach(snd=>{
        if(!snd.track||snd.track.kind!=="video")return;
        const p=snd.getParameters();
        if(!p.encodings||!p.encodings.length)p.encodings=[{}];
        p.encodings[0].maxBitrate=MAXBR*1000;
        p.encodings[0].scaleResolutionDownBy=1;
        p.degradationPreference=nitido?"maintain-resolution":"balanced";
        snd.setParameters(p);
      });
    }catch(e){}
  });
}
function dropSession(id){
  const s=sessions.get(id);
  if(!s)return;
  fecharCall(id);
  sessions.delete(id);
  try{s.ch.close()}catch(e){}
  status();
}
function fecharCall(id){
  const s=sessions.get(id);
  if(s&&s.call){try{s.call.close()}catch(e){}s.call=null}
}

function encerrar(){
  clearInterval(hb);
  sessions.forEach((s,id)=>{fecharCall(id);try{s.ch.close()}catch(e){}});
  sessions.clear();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(main){const p=main;main=null;p.destroy()}
  $("painel").classList.add("hide");$("qr").classList.add("hide");
  $("bStop").classList.add("hide");$("bShare").classList.remove("hide");
  if(!$("criar").classList.contains("hide"))msg("st1","Transmissão encerrada. O QR code e o código antigos não valem mais.");
}

/* ---------- Acessar transmissão ---------- */
let vp=null, vch=null, vcall=null, vtimer=null, vhb=null, lastHost=0, vendo=false, wantCode=null;

function entrar(){
  const code=$("code").value.trim().toUpperCase();
  if(code.length!==5){msg("st2","Digite os 5 caracteres do código.");return}
  wantCode=code;
  sair(true);
  msg("st2","Conectando…");
  vp=new Peer();
  vp.on("open",()=>{
    const ch=vp.connect(PRE+code,{reliable:true});
    vch=ch;
    vtimer=setTimeout(()=>{msg("st2","Código inválido ou transmissão encerrada.");sair(true)},12000);
    ch.on("open",()=>{
      clearTimeout(vtimer);
      lastHost=Date.now();
      clearInterval(vhb);
      vhb=setInterval(()=>{
        if(vch===ch&&ch.open){try{ch.send({cmd:"ping"})}catch(e){}}
        if(vch===ch&&!document.hidden&&Date.now()-lastHost>8000){
          sair(true);msg("st2","Conexão perdida. Reconectando…");
          if(wantCode){$("code").value=wantCode;entrar()}
        }
      },2000);
      $("entrada").classList.add("hide");$("sessao").classList.remove("hide");
      $("bVoltar").classList.add("hide");
      msg("st2","Você entrou. Pode ver e parar de ver quando quiser.");
      assistir();
    });
    ch.on("data",d=>{lastHost=Date.now();if(d&&d.nome)$("vnome").textContent=d.nome});
    ch.on("close",()=>{if(vch===ch){sair(true);msg("st2","A transmissão foi encerrada.")}});
  });
  vp.on("call",call=>{
    vcall=call;
    call.answer(undefined,{sdpTransform:sdpBanda});
    call.on("stream",s=>{
      try{call.peerConnection.getReceivers().forEach(r=>{try{r.playoutDelayHint=0}catch(e){}try{r.jitterBufferTarget=0}catch(e){}})}catch(e){}
      $("vid").srcObject=s;$("vid").classList.remove("hide");$("bFull").classList.remove("hide");
      $("bVer").classList.add("hide");$("bPara").classList.remove("hide");
      vendo=true;
    });
    call.on("close",()=>{if(vcall===call)esconderVideo()});
  });
  vp.on("error",e=>{
    if(e.type==="peer-unavailable")wantCode=null;
    msg("st2",e.type==="peer-unavailable"?"Código inválido ou transmissão encerrada.":"Erro: "+e.type);
    sair(true);
  });
}

function assistir(){
  if(vch&&vch.open){vch.send({cmd:"watch"});msg("st2","Conectando a imagem…")}
}
function esconderVideo(){
  $("vid").srcObject=null;$("vid").classList.add("hide");$("bFull").classList.add("hide");
  $("bPara").classList.add("hide");$("bVer").classList.remove("hide");
}
function pararVer(){
  vendo=false;
  if(vcall){try{vcall.close()}catch(e){}vcall=null}
  if(vch&&vch.open)vch.send({cmd:"stop"});
  esconderVideo();
  msg("st2","Você parou de ver. Toque em Ver compartilhamento pra voltar.");
}
function sair(silencio){
  clearTimeout(vtimer);clearInterval(vhb);
  if(silencio!==true){wantCode=null;vendo=false}
  const p=vp,c=vch;vp=null;vch=null;vcall=null;
  if(c){try{c.close()}catch(e){}}
  if(p){try{p.destroy()}catch(e){}}
  esconderVideo();
  $("sessao").classList.add("hide");$("entrada").classList.remove("hide");
  $("bVoltar").classList.remove("hide");
  $("vnome").textContent="";
  if(silencio!==true&&!$("acessar").classList.contains("hide"))msg("st2","Você saiu da transmissão.");
}

/* minimizar / trocar de app: avisa a sala e retoma ao voltar */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(vch&&vch.open){try{vch.send({cmd:"away"})}catch(e){}}
    return;
  }
  lastHost=Date.now();
  if(vch&&vch.open){
    try{vch.send({cmd:"ping"})}catch(e){}
    if(vendo)assistir();
  }else if(wantCode&&!$("acessar").classList.contains("hide")){
    $("code").value=wantCode;entrar();
  }
});

/* avisa a sala quando a aba é fechada */
addEventListener("pagehide",()=>{
  if(vch&&vch.open){try{vch.send({cmd:"bye"})}catch(e){}}
});

/* QR: abre direto com o código */
const m=location.hash.match(/c=([A-Za-z0-9]{5})/);
if(m){
  history.replaceState(null,"",location.pathname);
  tela("acessar");$("code").value=m[1].toUpperCase();entrar();
}
</script>
</body>
</html>
